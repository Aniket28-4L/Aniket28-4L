name: Render profile motion

on:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
      - 'package.json'
      - '.github/workflows/render-profile-motion.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render Remotion assets
        run: npm run remotion:render

      - name: Publish motion assets
        run: |
          mkdir -p assets
          cp out/ai-architecture.gif assets/ai-architecture.gif
          cp out/delivery-pipeline.gif assets/delivery-pipeline.gif
          cp out/debugging-log.gif assets/debugging-log.gif
          cp out/build-timeline.gif assets/build-timeline.gif
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.gif
          git diff --cached --quiet || git commit -m 'build: render Remotion profile assets'
          git push
